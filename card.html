<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="card">
        <div class="card-details">
            <div class="card-special">
                <div class="card-special-header">Special Action</div>
                <div class="card-special-desc"> If your combination includes 3 or more magic shield symbols: increase your energy level by 3.</div>
            </div>
            <div class="card-name">Aard</div>
            <div class="card-cost">1</div>
        </div>
        <div class="card-biom-back"></div>
        <div class="card-biom"></div>
        <div class="card-actions-wrapper">
            <div class="card-actions">
                <div class="card-action"></div>
                <div class="card-action"></div>
                <div class="card-action"></div>
                <div class="card-action"></div>
                <div class="card-action"></div>
            </div>
            <div class="card-actions-shadow"></div>
            <div class="card-combos">
                <div class="card-combo-tongue green">
                    <div class="card-combo-action"></div>
                    <div class="card-combo-action"></div>
                </div>
                <div class="card-combo-tongue yellow"></div>
                <div class="card-combo-tongue purple"></div>
                <div class="card-combo-tongue blue">
                    <div class="card-combo-action"></div>
                </div>
                <div class="card-combo-tongue red"></div>
            </div>
        </div>
        <div class="card-school-sign"></div>
    </div>
</body>
</html>
